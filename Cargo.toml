[workspace]
resolver = "2"
members = [
    "packages/a2ui",
    "packages/ui",
    "packages/web",
    "packages/desktop",
    "packages/mobile",
    "packages/api",
]

[workspace.dependencies]
dioxus = { version = "0.7.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# workspace
a2ui = { path = "packages/a2ui" }
ui = { path = "packages/ui" }
api = { path = "packages/api" }
