[package]
name = "a2ui"
version = "0.1.0"
edition = "2021"
description = "A2UI v0.9 renderer for Dioxus"

[dependencies]
dioxus = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
pretty_assertions = "1"
